[project]
name = "sts2rec"
version = "0.1.0"
description = "Offline tooling for Slay the Spire 2 recorder sessions: list, validate, archive, canonicalize."
readme = { text = "Offline tooling for hack-sts2 recorder sessions.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
sts2rec = "sts2rec.cli:main"
sts2text = "sts2rec.text_cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sts2rec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sts2rec"]
