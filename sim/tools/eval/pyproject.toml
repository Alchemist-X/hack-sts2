[project]
name = "sts2eval"
version = "0.1.0"
description = "Concurrent evaluation runner for the Sts2Sim HTTP play server"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
]

[project.scripts]
sts2eval = "sts2eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sts2eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
