[project]
name = "sts2train-smoke"
version = "0.1.0"
description = "Smoke-test learner on the sts2vec batched interface: entity-encoder policy, PPO, and the NN protocol-eval entry point"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "matplotlib>=3.8",
    "sts2vec",
    "sts2eval",
]

[project.scripts]
sts2train-smoke = "sts2train.cli:main"

[project.entry-points.pytest11]
sts2train = "sts2train._pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
sts2vec = { path = "../vec", editable = true }
sts2eval = { path = "../eval", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sts2train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
