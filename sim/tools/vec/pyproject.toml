[project]
name = "sts2vec"
version = "0.1.0"
description = "Batched numpy interface to the Sts2Sim rules simulator (in-process C ABI of Sts2Sim.Vec via hostfxr)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
sts2vec = "sts2vec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sts2vec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
